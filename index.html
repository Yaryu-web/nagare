<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>野流 LIVE CONTROL</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>


<body>

<div id="app">


  <!-- =========================
       ROLE
  ========================== -->

  <section
    id="role-screen"
    class="screen">

    <h1>野流</h1>

    <p class="subtitle">
      LIVE CONTROL
    </p>

    <div class="role-buttons">

      <button
        class="role-button parent"
        onclick="enterParent()">

        親

        <small>
          CONTROL
        </small>

      </button>


      <button
        class="role-button child"
        onclick="enterChild()">

        子

        <small>
          PLAYER
        </small>

      </button>

    </div>

  </section>



  <!-- =========================
       PARENT
  ========================== -->

  <section
    id="parent-screen"
    class="screen hidden">


    <header>

      <div>

        <h1>
          野流 LIVE CONTROL
        </h1>

        <span class="mode">
          PARENT
        </span>

      </div>


      <button
        onclick="backToRole()">

        戻る

      </button>

    </header>



    <main class="parent-layout">


      <!-- PLAYERS -->

      <section class="panel">

        <h2>
          演奏者
        </h2>


        <div
          id="parent-players">
        </div>


        <button
          class="add-player-button"
          onclick="addPlayer()">

          ＋ 演奏者を追加

        </button>

      </section>



      <!-- INSTRUCTION -->

      <section class="panel">

        <h2>
          指示
        </h2>


        <div
          id="selected-player"
          class="selected-player">

          演奏者を選択してください

        </div>


        <div
          class="instruction-grid">

          <button
            onclick="sendInstruction('STOP')">
            STOP
          </button>

          <button
            onclick="sendInstruction('CONTINUE')">
            CONTINUE
          </button>

          <button
            onclick="sendInstruction('LOUDER')">
            LOUDER
          </button>

          <button
            onclick="sendInstruction('QUIETER')">
            QUIETER
          </button>

          <button
            onclick="sendInstruction('SOLO')">
            SOLO
          </button>

          <button
            onclick="sendInstruction('FREE')">
            FREE
          </button>

        </div>

      </section>



      <!-- SCALE -->

      <section class="panel scale-panel">

        <h2>
          スケール
        </h2>


        <label>

          スケール

          <select
            id="scale-select">

          </select>

        </label>


        <div
          id="parent-scale-preview"
          class="scale-preview">

        </div>


        <button
          class="scale-send-button"
          onclick="sendScale()">

          スケールを送信

        </button>

      </section>



      <!-- SCORE -->

      <section class="panel">

        <h2>
          スコア
        </h2>


        <div
          id="score-list">
        </div>


        <hr>


        <h3>
          スコア編集
        </h3>


        <label>

          タイトル

          <input
            id="score-title">

        </label>


        <label>

          内容

          <textarea
            id="score-content">
          </textarea>

        </label>


        <button
          onclick="saveScore()">

          スコアを保存

        </button>

      </section>



      <!-- CHAT -->

      <section
        class="panel chat-panel">

        <h2>
          チャット
        </h2>


        <div
          id="chat-log">
        </div>


        <div
          class="chat-input">

          <input
            id="parent-chat-input"
            placeholder="メッセージ">


          <button
            onclick="sendParentChat()">

            送信

          </button>

        </div>

      </section>


    </main>

  </section>



  <!-- =========================
       CHILD
  ========================== -->

  <section
    id="child-screen"
    class="screen hidden">


    <header>

      <div>

        <h1>
          野流
        </h1>

        <span class="mode">
          PLAYER
        </span>

      </div>


      <button
        onclick="backToRole()">

        戻る

      </button>

    </header>



    <main class="child-layout">


      <!-- PLAYER -->

      <section
        class="player-card">


        <div
          class="player-instrument"
          id="child-instrument">

          —

        </div>


        <div
          id="child-instruction"
          class="instruction-display">

          WAIT

        </div>


      </section>



      <!-- SCALE -->

      <section
        class="panel child-scale-panel">


        <div class="child-section-label">
          SCALE
        </div>


        <div
          id="child-scale-name"
          class="child-scale-name">

          —

        </div>


        <div
          id="child-scale-notes"
          class="child-scale-notes">

          —

        </div>


      </section>



      <!-- SCORE -->

      <section
        class="panel">


        <h2
          id="child-score-title">

          SCORE

        </h2>


        <div
          id="child-score-content"
          class="score-display">

        </div>


      </section>



      <!-- CHAT -->

      <section
        class="panel chat-panel">


        <h2>
          チャット
        </h2>


        <div
          id="child-chat-log">
        </div>


        <div
          class="chat-input">

          <input
            id="child-chat-input"
            placeholder="メッセージ">


          <button
            onclick="sendChildChat()">

            送信

          </button>

        </div>


      </section>


    </main>

  </section>


</div>


<script src="app.js"></script>

</body>

</html>
