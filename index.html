<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野流 LIVE CONTROL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="role-screen" class="screen">
    <h1>野流</h1>
    <p class="subtitle">LIVE CONTROL</p>

    <div class="role-buttons">
      <button class="role-button parent" onclick="enterParent()">
        親
        <small>CONTROL</small>
      </button>

      <button class="role-button child" onclick="enterChild()">
        子
        <small>PLAYER</small>
      </button>
    </div>
  </section>


  <section id="parent-screen" class="screen hidden">

    <header>
      <div>
        <h1>野流 LIVE CONTROL</h1>
        <span class="mode">PARENT</span>
      </div>

      <button class="secondary" onclick="backToRole()">
        戻る
      </button>
    </header>


    <main class="parent-layout">

      <!-- PLAYERS -->

      <section class="panel">

        <div class="panel-heading">
          <h2>演奏者</h2>

          <button
            class="small-button"
            onclick="addPlayer()">
            ＋ 演奏者を追加
          </button>
        </div>

        <div id="parent-players"></div>

        <div
          id="player-editor"
          class="editor-box">
        </div>

      </section>


      <!-- INSTRUCTIONS -->

      <section class="panel">

        <h2>指示</h2>

        <div
          id="selected-player"
          class="selected-target">
          演奏者を選択してください
        </div>

        <div class="instruction-grid">

          <button onclick="sendInstruction('STOP')">
            STOP
          </button>

          <button onclick="sendInstruction('CONTINUE')">
            CONTINUE
          </button>

          <button onclick="sendInstruction('LOUDER')">
            LOUDER
          </button>

          <button onclick="sendInstruction('QUIETER')">
            QUIETER
          </button>

          <button onclick="sendInstruction('SOLO')">
            SOLO
          </button>

          <button onclick="sendInstruction('FREE')">
            FREE
          </button>

        </div>

        <div class="broadcast-row">

          <button onclick="sendInstruction('STOP', true)">
            全員 STOP
          </button>

          <button onclick="sendInstruction('CONTINUE', true)">
            全員 CONTINUE
          </button>

        </div>

      </section>


      <!-- SCORE -->

      <section class="panel">

        <h2>スコア</h2>

        <div id="score-list"></div>

        <hr>

        <h3>スコア編集</h3>

        <label>
          タイトル
          <input id="score-title">
        </label>

        <label>
          内容
          <textarea id="score-content"></textarea>
        </label>

        <button onclick="saveScore()">
          スコアを保存
        </button>

      </section>


      <!-- SCALE -->

      <section class="panel scale-panel">

        <h2>スケール</h2>

        <div class="scale-controls">

          <label>
            カテゴリ

            <select
              id="scale-category"
              onchange="renderScaleList()">
            </select>

          </label>


          <label>
            スケール

            <select
              id="scale-select"
              onchange="previewScale()">
            </select>

          </label>

        </div>


        <div
          id="scale-preview"
          class="scale-preview">
        </div>


        <button
          class="send-scale"
          onclick="sendScale()">
          このスケールを送信
        </button>


        <hr>

        <h3>スケール編集</h3>

        <div id="scale-editor"></div>

      </section>


      <!-- CHAT / TIMELINE -->

      <section class="panel chat-panel">

        <div class="panel-heading">

          <h2>
            指示 / チャット タイムライン
          </h2>

          <button
            class="small-button"
            onclick="clearTimeline()">
            クリア
          </button>

        </div>


        <div
          id="chat-log"
          class="timeline">
        </div>


        <div class="chat-input">

          <input
            id="parent-chat-input"
            placeholder="メッセージ">

          <button onclick="sendParentChat()">
            送信
          </button>

        </div>

      </section>

    </main>

  </section>


  <!-- CHILD -->

  <section id="child-screen" class="screen hidden">

    <header>

      <div>
        <h1>野流</h1>
        <span class="mode">PLAYER</span>
      </div>

      <button
        class="secondary"
        onclick="backToRole()">
        戻る
      </button>

    </header>


    <main class="child-layout">


      <!-- PLAYER SELECT -->

      <section class="panel">

        <h2>自分のパート</h2>

        <div
          id="child-player-list"
          class="child-player-list">
        </div>

      </section>


      <!-- CURRENT INSTRUCTION -->

      <section class="player-card">

        <div
          id="child-player-name"
          class="child-player-name">
          —
        </div>

        <div
          id="child-instrument"
          class="player-instrument">
          —
        </div>

        <div
          id="child-instruction"
          class="instruction-display">
          WAIT
        </div>

      </section>


      <!-- GLOBAL -->

      <section class="panel">

        <h2>全体への指示</h2>

        <div
          id="child-global-instructions"
          class="instruction-history">
        </div>

      </section>


      <!-- PERSONAL -->

      <section class="panel">

        <h2>自分への指示</h2>

        <div
          id="child-personal-instructions"
          class="instruction-history">
        </div>

      </section>


      <!-- SCORE -->

      <section class="panel">

        <h2 id="child-score-title">
          SCORE
        </h2>

        <div
          id="child-score-content"
          class="score-display">
        </div>

      </section>


      <!-- SCALE -->

      <section class="panel">

        <h2>現在のスケール</h2>

        <div
          id="child-scale"
          class="scale-preview">
        </div>

      </section>


      <!-- CHAT -->

      <section class="panel chat-panel">

        <h2>
          チャット / 指示履歴
        </h2>

        <div
          id="child-chat-log"
          class="timeline">
        </div>

        <div class="chat-input">

          <input
            id="child-chat-input"
            placeholder="メッセージ">

          <button onclick="sendChildChat()">
            送信
          </button>

        </div>

      </section>

    </main>

  </section>

</div>


<script src="app.js"></script>

</body>
</html>
